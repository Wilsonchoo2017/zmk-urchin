# enable bluetooth
CONFIG_BT=y

# increase bluetooth signal power
CONFIG_BT_CTLR_TX_PWR_PLUS_8=n

# enable deep sleep support
CONFIG_ZMK_SLEEP=y

# the keyboard disconnects from bluetooth.
# uses very little power, but it may take
# a few seconds to reconnect after waking.
# 1.800.000 ms = 30 minutes
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000

# "Eager Debouncing"
# Trying to lower the input lag.
# CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=1
# CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5

# --- ARTSEY ---
# ARTSEY is combo-heavy (about 45 combos over 8 keys). v0.3.0 sizes the combo
# storage per key and the max keys per combo automatically from devicetree, so
# only the "simultaneously active combos" pool needs raising; upstream's
# artsey.conf asks for 8. The two MAX_* options below are deprecated no-ops on
# v0.3.0 and are kept only as documentation of the intent.
CONFIG_ZMK_COMBO_MAX_PRESSED_COMBOS=8
#CONFIG_ZMK_COMBO_MAX_COMBOS_PER_KEY=16
#CONFIG_ZMK_COMBO_MAX_KEYS_PER_COMBO=8

# --- DISPLAY SETTINGS ---

# enable display
CONFIG_ZMK_DISPLAY=y
# custom status screen (nice-view-gem)
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
# turn off gem animation to save battery
CONFIG_NICE_VIEW_GEM_ANIMATION=n

# source: https://github.com/M165437/nice-view-gem/blob/main/README.md
