# increase bluetooth signal power
CONFIG_BT_CTLR_TX_PWR_PLUS_8=n

# enable deep sleep support
CONFIG_ZMK_SLEEP=y

# the keyboard disconnects from bluetooth.
# uses very little power, but it may take
# a few seconds to reconnect after waking.
# 1.800.000 ms = 30 minutes
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000

# "Eager Debouncing"
# Trying to lower the input lag.
# CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=1
# CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5

# --- DISPLAY SETTINGS ---

# display battery as n%
CONFIG_ZMK_WIDGET_BATTERY_STATUS_SHOW_PERCENTAGE=y

# --- NICE-VIEW-GEM SETTINGS ---

# Fixed WPM range (vs dynamic)
CONFIG_NICE_VIEW_GEM_WPM_FIXED_RANGE=y
# Max WPM shown on gauge
CONFIG_NICE_VIEW_GEM_WPM_FIXED_RANGE_MAX=100
# Enable crystal animation
CONFIG_NICE_VIEW_GEM_ANIMATION=y
# Animation frame timing (ms)
CONFIG_NICE_VIEW_GEM_ANIMATION_MS=960
